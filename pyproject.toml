[tool.poetry]
name = "aws-admin-cli"
version = "0.1.0"
description = "A CLI for administering AWS (and LocalStack) resources: IAM, S3, VPC, EC2."
authors = ["Ruben Ortega <neburortega0214@gmail.com>"]
readme = "README.md"
packages = [{ include = "aws_admin_cli", from = "src" }]

[tool.poetry.scripts]
aws-admin-cli = "aws_admin_cli.main:run"

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
typer = { extras = ["all"], version = "^0.27" }
boto3 = "^1.34"
botocore = "^1.34"
pydantic = "^2.7"
pydantic-settings = "^2.2"
rich = "^13.7"
pyyaml = "^6.0"
questionary = "^2.0"
graphifyy = "^0.9.50"

[tool.poetry.group.dev.dependencies]
pytest = "^8.1"
pytest-cov = "^5.0"
pytest-mock = "^3.14"
moto = { extras = ["all"], version = "^5.0" }
mypy = "^1.9"
ruff = "^0.4"
boto3-stubs = { extras = ["iam", "s3", "ec2"], version = "^1.34" }
types-requests = "^2.31"
types-PyYAML = "^6.0"
pre-commit = "^3.7"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "TCH", "ARG", "PTH", "RUF", "ANN", "D"]
ignore = ["D203", "D213", "ANN401"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN", "ARG", "S101"]

[tool.mypy]
strict = true
python_version = "3.12"
warn_unreachable = true
disallow_any_generics = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "moto.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config --cov=aws_admin_cli --cov-report=term-missing --cov-report=html"
markers = [
    "unit: fast, isolated tests with no external services",
    "integration: tests exercising adapters against LocalStack",
    "e2e: requiere LocalStack corriendo (deselect con -m \"not e2e\")",
]

[tool.coverage.run]
source = ["src/aws_admin_cli"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "pragma: no cover",
]
